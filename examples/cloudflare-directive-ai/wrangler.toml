name = "example-cloudflare-directive-ai"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AGENT_ROOM"
class_name = "AgentRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentRoom"]

[[r2_buckets]]
binding = "AUDIT_LOG"
bucket_name = "example-directive-ai-audit"

# Set with: wrangler secret put ANTHROPIC_API_KEY
