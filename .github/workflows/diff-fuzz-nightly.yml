name: Differential fuzz (nightly)

# The 2.0 oracle's fuzzer at depth: a fresh random seed every night and
# 25x the cases PR CI runs across every layer (which pins seed 0x5eed at 205).
# On top of the 5,000, it adds 2,000 more (40%) generated at or below the layer
# core-next has built (layers.rules.json `current`), so v2 takes part in them
# (diff/fuzz/fuzz.test.ts): 7,000 cases in all.
# On a failure fast-check prints the seed and the shrink path, and the
# error carries the shrunk spec and the first divergence: rerun locally with
#   DIFF_FUZZ_SEED=<seed> DIFF_FUZZ_RUNS=5000 pnpm --filter @directive-run/conformance \
#     exec vitest run --config vitest.config.ts --project conformance:diff diff/fuzz

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Seed to replay (blank for a random one)
        required: false
      runs:
        description: Number of cases (at least 200)
        required: false
        default: "5000"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The conformance vitest config resolves core's and core-next's builds
      # when it loads.
      - run: pnpm --filter @directive-run/core build
      - run: pnpm --filter @directive-run/core-next build

      - name: Pick the seed
        id: seed
        env:
          INPUT_SEED: ${{ inputs.seed }}
        run: |
          if [ -n "$INPUT_SEED" ]; then
            seed="$INPUT_SEED"
          else
            seed=$(( (RANDOM << 15) | RANDOM ))
          fi
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "::notice title=Differential fuzz seed::$seed"

      - name: Fuzz
        env:
          DIFF_FUZZ_SEED: ${{ steps.seed.outputs.seed }}
          DIFF_FUZZ_RUNS: ${{ inputs.runs || '5000' }}
        working-directory: packages/conformance
        # 7,000 cases (5,000 across every layer and 2,000 for v2) on three
        # engines (v1, local, v2) need more than the project's 120 s default;
        # PR runs use fewer cases and keep it.
        run: ./node_modules/.bin/vitest run --config vitest.config.ts --project conformance:diff --testTimeout=1200000 diff/fuzz
