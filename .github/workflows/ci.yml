name: CI

# Every branch, not only main. Restricting this to `main` meant a branch
# could accumulate work for weeks with nothing checking it, and the first
# run happened when a pull request opened — by which point several
# independent failures were stacked on each other, each hiding the next.
# Two of them would have broken the release rather than the branch.
on:
  push:
  pull_request:

# A branch push and its pull request would otherwise both fire for the same
# commit. Same-repo work is covered by `push`; `pull_request` is left to do
# the job for forks, where `push` does not reach us.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Skip the pull_request event for branches in this repository, which
    # `push` has already covered. Fork pull requests still run, since no
    # push event reaches us for those.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Must precede the build. The knowledge package builds api-skeleton.md
      # from docs/generated/api-reference.json, which lives in the sibling
      # directive-docs repo — absent on a runner that checks out this
      # repository alone. That build step now fails rather than emitting a
      # placeholder, because the placeholder is how a stub reached npm, so the
      # file has to be on disk before `build` runs rather than after it.
      #
      # directive-docs uploads the same JSON to the latest GitHub release on
      # each cut. A failed fetch fails the job: the build immediately after it
      # cannot succeed without this file, and stopping here says why in one
      # line instead of surfacing as a confusing build error two steps later.
      - name: Fetch api-reference.json from the newest release carrying it
        run: .github/scripts/fetch-api-reference.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm -r --filter './packages/*' build

      - run: pnpm test -- --run

      - run: pnpm lint

      - run: pnpm -r --filter './packages/*' typecheck

      # Bundle-size budgets enforce the lean adapter promise. Fails when a
      # gzipped published entry busts the budget in `size-budgets.json`; raise
      # the budget intentionally when shipping a deliberate new feature.
      - run: pnpm size

      - name: Check knowledge freshness
        # Soft-warns instead of failing CI. The check IS valuable for
        # catching mid-cycle drift (someone edited a source export
        # without regenerating api-skeleton.md), but EVERY first commit
        # after a release trips it — the just-published release contains
        # the new exports' api-reference.json, but the committed
        # api-skeleton.md was generated against the previous release. We
        # don't want a recurring red CI on every post-release commit; we
        # do want the drift surfaced for human review. Annotation +
        # truncated diff give the reviewer enough to decide.
        run: |
          pnpm --filter @directive-run/knowledge generate
          if ! git diff --quiet packages/knowledge/api-skeleton.md; then
            echo "::warning title=api-skeleton.md drift::Knowledge api-skeleton.md does not match regeneration against the latest release's api-reference.json. This is EXPECTED on the first commit after a release (new exports just shipped). If you see it mid-cycle, run \`pnpm --filter @directive-run/knowledge generate\` locally and commit the result."
            echo "---drift diff (truncated to 60 lines)---"
            git diff packages/knowledge/api-skeleton.md | head -60
            echo "---end drift diff---"
          fi

      - name: Check plugin skills freshness
        run: |
          pnpm --filter @directive-run/claude-plugin build
          git diff --exit-code packages/claude-plugin/skills/

  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same reason as the build-and-test job: building the packages requires
      # api-reference.json on disk, and this runner has no sibling docs
      # checkout either.
      - name: Fetch api-reference.json from the newest release carrying it
        run: .github/scripts/fetch-api-reference.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm -r --filter './packages/*' build

      - run: pnpm test:e2e:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --config e2e/playwright.config.ts
