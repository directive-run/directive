name: CI

# Every branch, not only main. Restricting this to `main` meant a branch
# could accumulate work for weeks with nothing checking it, and the first
# run happened when a pull request opened — by which point several
# independent failures were stacked on each other, each hiding the next.
# Two of them would have broken the release rather than the branch.
# Pull requests run on `pull_request`; `push` only runs for main. Every job
# runs on both events, never skipped: a skipped job reports a check with the
# same name as a required one, and GitHub counts a skipped check as passing,
# so a red run could merge beside a skipped twin (#205 did).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Skip the pull_request event for branches in this repository, which
    # `push` has already covered. Fork pull requests still run, since no
    # push event reaches us for those.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Major-aware API reference selection test
        run: scripts/__tests__/fetch-api-reference.test.sh

      # Must precede the build. The knowledge package builds api-skeleton.md
      # from docs/generated/api-reference.json, which lives in the sibling
      # directive-docs repo — absent on a runner that checks out this
      # repository alone. That build step now fails rather than emitting a
      # placeholder, because the placeholder is how a stub reached npm, so the
      # file has to be on disk before `build` runs rather than after it.
      #
      # directive-docs uploads the same JSON to the latest GitHub release on
      # each cut. A failed fetch fails the job: the build immediately after it
      # cannot succeed without this file, and stopping here says why in one
      # line instead of surfacing as a confusing build error two steps later.
      - name: Fetch api-reference.json from the newest release carrying it
        run: .github/scripts/fetch-api-reference.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm -r --filter './packages/*' build

      - run: pnpm test -- --run

      - run: pnpm lint

      - run: pnpm -r --filter './packages/*' typecheck

      # Blocking: exits non-zero when a knowledge file names an API symbol
      # that no package declares (drift between the AI-assistant docs and
      # the code).
      - name: Validate knowledge files
        run: pnpm --filter @directive-run/knowledge validate

      # Bundle-size budgets enforce the lean adapter promise. Fails when a
      # gzipped published entry busts the budget in `size-budgets.json`; raise
      # the budget intentionally when shipping a deliberate new feature.
      - run: pnpm size

      # The 2.0 graph module's gzip budget (scripts/size.mjs). Runs after the
      # build so it also reports the built dist/index.js beside the source.
      - run: pnpm --filter @directive-run/core-next size:check

      # Ratchet: no new `as any` casts on system objects in packages/ai/src.
      - run: pnpm check:ai-casts

      - name: Check knowledge freshness
        # Soft-warns instead of failing CI. The check IS valuable for
        # catching mid-cycle drift (someone edited a source export
        # without regenerating api-skeleton.md), but EVERY first commit
        # after a release trips it — the just-published release contains
        # the new exports' api-reference.json, but the committed
        # api-skeleton.md was generated against the previous release. We
        # don't want a recurring red CI on every post-release commit; we
        # do want the drift surfaced for human review. Annotation +
        # truncated diff give the reviewer enough to decide.
        run: |
          pnpm --filter @directive-run/knowledge generate
          if ! git diff --quiet packages/knowledge/api-skeleton.md; then
            echo "::warning title=api-skeleton.md drift::Knowledge api-skeleton.md does not match regeneration against the latest release's api-reference.json. This is EXPECTED on the first commit after a release (new exports just shipped). If you see it mid-cycle, run \`pnpm --filter @directive-run/knowledge generate\` locally and commit the result."
            echo "---drift diff (truncated to 60 lines)---"
            git diff packages/knowledge/api-skeleton.md | head -60
            echo "---end drift diff---"
          fi

      - name: Check plugin skills freshness
        run: |
          pnpm --filter @directive-run/claude-plugin build
          git diff --exit-code packages/claude-plugin/skills/

  # The 2.0 oracle: core's black-box tests, run against the published 1.35.0
  # (the reference) and the workspace engine, plus the check that the ports
  # are faithful and its tamper tests. The suite's typecheck runs in
  # build-and-test with every other package.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TODO(2.0 Phase 0 gate): remove continue-on-error and make this job a
    # required check once Jason signs off the Phase 0 gate (frozen-contract
    # list + WHITE-BOX.md fates), before any core-next code lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Two tests use the built package: one imports the engine's ESM entry
      # in a child process, one typechecks against its declarations. They run
      # on every engine, so build both the 1.35 core and core-next (v2).
      - run: pnpm --filter @directive-run/core build
      - run: pnpm --filter @directive-run/core-next build

      # Three independent steps. check-expects proves the ports are faithful;
      # the census runs every project and proves the run was complete (and
      # verifies the harness lock, so a neutered check-expects is caught);
      # the guard proves the correctness baseline only tightened and the
      # harness matches its lock. The label and path rules for pull requests
      # run from the base branch in oracle-guard.yml.
      - run: pnpm --filter @directive-run/conformance check:expects
      - run: pnpm --filter @directive-run/conformance census
      - run: pnpm --filter @directive-run/conformance oracle:guard

  # Packaging breakage (wrong exports/types fields, a CJS consumer resolving
  # ESM types, a tarball that will not install) never shows up in unit tests,
  # which import from source. This builds, lints the metadata with publint and
  # are-the-types-wrong, then installs the packed core + react tarballs into a
  # clean project with plain npm and loads/type-checks them.
  package-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same reason as the build-and-test job: the build needs
      # api-reference.json on disk before it runs.
      - name: Fetch api-reference.json from the newest release carrying it
        run: .github/scripts/fetch-api-reference.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm -r --filter './packages/*' build

      - run: pnpm check:packages

      - run: pnpm smoke:install

  # Every example must keep compiling against the workspace packages, so an
  # API change cannot silently strand the examples. Blocking.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same reason as the build-and-test job: the build needs
      # api-reference.json on disk before it runs.
      - name: Fetch api-reference.json from the newest release carrying it
        run: .github/scripts/fetch-api-reference.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm -r --filter './packages/*' build

      - name: Type-check examples
        run: pnpm -r --no-bail --filter './examples/*' typecheck

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same reason as the build-and-test job: building the packages requires
      # api-reference.json on disk, and this runner has no sibling docs
      # checkout either.
      - name: Fetch api-reference.json from the newest release carrying it
        run: .github/scripts/fetch-api-reference.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm -r --filter './packages/*' build

      - run: pnpm test:e2e:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --config e2e/playwright.config.ts
