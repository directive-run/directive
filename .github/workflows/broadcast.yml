name: Broadcast

# Announces every GitHub release on the configured social platforms.
#
# This workflow now consumes the reusable-workflow shape from
# sizls/broadcast-action rather than the bundled JavaScript action.
# The reusable workflow shells out to `npx @sizl/broadcast-cli`
# internally, which runs `npm audit signatures` on the CLI tarball
# before invoking it — a shorter trust chain than pinning the ~3 MB
# `dist/index.js` bundle by SHA.
#
# Trigger sequence during a real release:
#   1. Push to main lands a Version Packages merge.
#   2. release.yml runs: build → typecheck → tests → changesets publish
#      (creates the GitHub Release as its final step).
#   3. GitHub emits release:published.
#   4. This workflow fires. The reusable workflow parses the release
#      payload, sanitises + signs each cassette, and dispatches to
#      bluesky/mastodon/discord.
#
# Missing platform secrets cause silent per-platform skips inside the
# CLI (see broadcast-reusable.yml on sizls/broadcast-action). Add
# secrets via `gh secret set` as they become available; no workflow
# change needed to enable a new platform once its secret is bound.

on:
  release:
    types: [published]
  # Manual trigger for validation runs. Needed because
  # `changesets/action` uses `GITHUB_TOKEN` to create GitHub Releases,
  # and releases created with `GITHUB_TOKEN` do NOT fire downstream
  # `release: [published]` events (GitHub's recursion protection). So
  # a real Directive publish leaves this workflow dormant; running it
  # via `gh workflow run Broadcast --ref main` after a release lets
  # operators re-fire the dispatch against the latest tag. The
  # permanent fix is either giving `changesets/action` a PAT or
  # having release.yml call `gh workflow run Broadcast` explicitly
  # after `createGithubReleases`; until one of those lands, this
  # dispatch is how live-fires happen.
  workflow_dispatch:

jobs:
  broadcast:
    # Reusable workflow SHA pin. 94c0e28 is the v0.11.7 tag on
    # sizls/broadcast-action. Bump history:
    #   v0.11.3 — @sizl scope typo (never worked on npm)
    #   v0.11.4 — corrected scope to @sizls
    #   v0.11.5 — dropped `cache: "npm"` from setup-node (pnpm callers)
    #   v0.11.6 — dropped `--package-lock-only` from audit install
    #   v0.11.7 — added --ignore-scripts (install-script supply-chain),
    #             honest provenance comment, dispatch smoke-test notice,
    #             timeout 300→480 on npx invocation
    # Every future bump reflects a broadcast-action release that
    # mirror-published this file (release-action.yml on sizl-broadcast
    # handles that on every broadcast-action-v* tag push).
    uses: sizls/broadcast-action/.github/workflows/broadcast-reusable.yml@94c0e28686b2101fcf56cff04f1a446d32427fa0 # v0.11.7
    with:
      platforms: bluesky,mastodon,discord
      config-path: .sizl/broadcast.config.json
      cli-version: "0.1"
    secrets: inherit
