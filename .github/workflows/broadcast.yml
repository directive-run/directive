name: Broadcast

# Announces every GitHub release on the configured social platforms.
#
# This workflow now consumes the reusable-workflow shape from
# sizls/broadcast-action rather than the bundled JavaScript action.
# The reusable workflow shells out to `npx @sizl/broadcast-cli`
# internally, which runs `npm audit signatures` on the CLI tarball
# before invoking it — a shorter trust chain than pinning the ~3 MB
# `dist/index.js` bundle by SHA.
#
# Trigger sequence during a real release:
#   1. Push to main lands a Version Packages merge.
#   2. release.yml runs: build → typecheck → tests → changesets publish
#      (creates the GitHub Release as its final step).
#   3. GitHub emits release:published.
#   4. This workflow fires. The reusable workflow parses the release
#      payload, sanitises + signs each cassette, and dispatches to
#      bluesky/mastodon/discord.
#
# Missing platform secrets cause silent per-platform skips inside the
# CLI (see broadcast-reusable.yml on sizls/broadcast-action). Add
# secrets via `gh secret set` as they become available; no workflow
# change needed to enable a new platform once its secret is bound.

on:
  release:
    types: [published]
  # Manual trigger for validation runs. Needed because
  # `changesets/action` uses `GITHUB_TOKEN` to create GitHub Releases,
  # and releases created with `GITHUB_TOKEN` do NOT fire downstream
  # `release: [published]` events (GitHub's recursion protection). So
  # a real Directive publish leaves this workflow dormant; running it
  # via `gh workflow run Broadcast --ref main` after a release lets
  # operators re-fire the dispatch against the latest tag. The
  # permanent fix is either giving `changesets/action` a PAT or
  # having release.yml call `gh workflow run Broadcast` explicitly
  # after `createGithubReleases`; until one of those lands, this
  # dispatch is how live-fires happen.
  workflow_dispatch:

jobs:
  # TEMPORARY diagnostic: prove which side of the secret propagation
  # chain is emptying the value. Prints only the character length of
  # each secret at the caller's context. GitHub Actions doesn't
  # redact numeric length output, so this shows whether the caller
  # actually holds a non-empty value. Remove this job once the
  # BLUESKY_APP_PASSWORD → @directive.run posting path is proven
  # end-to-end and stable.
  diagnose-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Print length of every broadcast secret (values NOT printed)
        env:
          BROADCAST_API_KEY_LEN: ${{ secrets.BROADCAST_API_KEY }}
          BLUESKY_LEN: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_LEN: ${{ secrets.MASTODON_TOKEN }}
          DISCORD_LEN: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINKEDIN_LEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TWITTER_LEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          FACEBOOK_LEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          POSTS_INDEX_LEN: ${{ secrets.POSTS_INDEX_SECRET }}
        run: |
          echo "BROADCAST_API_KEY len: ${#BROADCAST_API_KEY_LEN}"
          echo "BLUESKY_APP_PASSWORD len: ${#BLUESKY_LEN}"
          echo "MASTODON_TOKEN len: ${#MASTODON_LEN}"
          echo "DISCORD_WEBHOOK_URL len: ${#DISCORD_LEN}"
          echo "LINKEDIN_ACCESS_TOKEN len: ${#LINKEDIN_LEN}"
          echo "TWITTER_BEARER_TOKEN len: ${#TWITTER_LEN}"
          echo "FACEBOOK_PAGE_TOKEN len: ${#FACEBOOK_LEN}"
          echo "POSTS_INDEX_SECRET len: ${#POSTS_INDEX_LEN}"

  broadcast:
    # Reusable workflow SHA pin. dd8ee22 is the v0.11.9 tag on
    # sizls/broadcast-action. Bump history:
    #   v0.11.3 — @sizl scope typo (never worked on npm)
    #   v0.11.4 — corrected scope to @sizls
    #   v0.11.5 — dropped `cache: "npm"` from setup-node (pnpm callers)
    #   v0.11.6 — dropped `--package-lock-only` from audit install
    #   v0.11.7 — added --ignore-scripts (install-script supply-chain),
    #             honest provenance comment, dispatch smoke-test notice,
    #             timeout 300→480 on npx invocation
    #   v0.11.8 — cli-version default 0.1 → 0.2 to track the new
    #             adapter set. Silently non-functional: the reusable
    #             workflow forwarded only the original three tokens
    #             (bluesky/mastodon/discord), and the CLI's four new
    #             adapters shipped with enabled: false so the
    #             broadcaster filtered them out even when built.
    #   v0.11.9 — corrects both. Declares + forwards
    #             LINKEDIN_ACCESS_TOKEN, TWITTER_BEARER_TOKEN,
    #             FACEBOOK_PAGE_TOKEN through the workflow_call
    #             surface. Pairs with @sizls/broadcast-cli@0.2.1
    #             (adapters actually enabled, cost-breaker scales,
    #             tryAdd throw-safe, wire-format fixes across
    #             LinkedIn / X / Facebook). Instagram is deferred
    #             to v0.3.
    # Every future bump reflects a broadcast-action release that
    # mirror-published this file (release-action.yml on sizl-broadcast
    # handles that on every broadcast-action-v* tag push).
    uses: sizls/broadcast-action/.github/workflows/broadcast-reusable.yml@dd8ee22952305ab41950446dad6f8239c3ec33ed # v0.11.9
    with:
      # Six-adapter launch set (CLI v0.2.1+). Instagram was in the
      # v0.2.0 launch set but came out in v0.2.1 pending a media
      # pipeline (release-payload path has no image source, adapter's
      # pinned Graph API v18.0 sunsets 2025-09, permalink shape wrong).
      # Each platform skips its adapter silently if the corresponding
      # env var is unbound in this repo's secrets — see
      # `docs/broadcast-secrets.md` for the setup checklist.
      platforms: bluesky,mastodon,discord,linkedin,twitter,facebook
      config-path: .sizl/broadcast.config.json
      cli-version: "0.2"
    # Named passthrough instead of `secrets: inherit`. The `inherit`
    # form silently fails to propagate to a reusable workflow in a
    # different organization — the callee's `${{ secrets.NAME }}`
    # evaluates to empty string, the CLI reports every platform as
    # "no secret bound," and the run goes green with zero posts.
    # Explicit named passing forces the caller-side lookup and hands
    # the resolved value to the callee. Add a line here whenever a
    # new secret enters the launch set on the sizls/broadcast-action
    # side (see `on.workflow_call.secrets:` in the reusable workflow
    # for the current expected set).
    secrets:
      BROADCAST_API_KEY: ${{ secrets.BROADCAST_API_KEY }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      POSTS_INDEX_SECRET: ${{ secrets.POSTS_INDEX_SECRET }}
