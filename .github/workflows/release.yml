name: Release

on:
  push:
    branches: [main, next]
    paths:
      - "packages/**"
      - ".changeset/**"
      - ".github/workflows/release.yml"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The knowledge package's build turns api-reference.json into
      # api-skeleton.md, and that JSON lives in the sibling directive-docs
      # repo, which this workflow does not check out. It used to write a
      # five-line placeholder and exit zero when the file was missing, which
      # is how a stub shipped in place of the entire API reference — to the
      # knowledge package and to every skill copy inside the plugin. Nothing
      # caught it, because the skill-sync check compares those copies against
      # each other and identical stubs are perfectly in sync.
      #
      # The build now refuses to substitute a placeholder, so the release has
      # to supply the real file. A failed fetch stops the release here rather
      # than publishing something hollow.
      #
      # The file must describe THIS tree, not the previous release. Fetching the
      # newest release's copy meant every publish shipped the API skeleton of
      # the release before it: knowledge and every plugin skill copy described
      # last version's exports, and nothing failed, because the skeleton was
      # regenerated consistently from the stale file. Generate it here instead.
      # The extractor resolves @directive-run/ai's re-exports through core's
      # built types, so core builds first.
      - name: Generate api-reference.json from this tree
        run: |
          pnpm --filter @directive-run/core build
          npm i -g @directive-run/toolkit@latest
          mkdir -p ../directive-docs/docs/generated
          extract-api-docs \
            --packages packages/core,packages/ai \
            --out ../directive-docs/docs/generated
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: pnpm -r --filter './packages/*' build

      # The committed api-skeleton.md is regenerated from this tree during
      # development. If the build produced something different, the release
      # would publish a skeleton nobody reviewed: stop instead.
      - name: Published API skeleton matches the committed one
        run: git diff --exit-code packages/knowledge/api-skeleton.md

      - run: pnpm -r --filter './packages/*' typecheck

      - run: pnpm test -- --run

      # Release lines must not cross. `next` carries the prerelease line and
      # must be in changesets pre mode (.changeset/pre.json); `main` is the
      # stable line and must not be. Either mismatch would publish a stable
      # version under the `next` tag, or a prerelease under `latest`.
      - name: Guard release line matches changesets mode
        run: |
          if [ "${GITHUB_REF_NAME}" = "next" ] && [ ! -f .changeset/pre.json ]; then
            echo "::error title=next is not in pre mode::.changeset/pre.json is missing on the next branch. See RELEASING.md, 'Starting the 2.0 prerelease line'."
            exit 1
          fi
          # `changeset pre exit` leaves pre.json with mode "exit" until `changeset version`
          # consumes it, so only mode "pre" means main is still in pre mode.
          if [ "${GITHUB_REF_NAME}" = "main" ] && [ -f .changeset/pre.json ] && [ "$(jq -r .mode .changeset/pre.json)" = "pre" ]; then
            echo "::error title=main is in pre mode::.changeset/pre.json exists on main; publishing would tag prereleases. Exit pre mode first."
            exit 1
          fi

      # Snapshot of the registry's `latest` before anything is published, so
      # the post-publish check can prove `next` left it alone.
      - name: Record npm latest dist-tag
        id: latest_before
        run: echo "version=$(npm view @directive-run/core dist-tags.latest || true)" >> "$GITHUB_OUTPUT"

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          # `changeset version` rewrites packages/*/package.json with the
          # bumped versions and expands `"files": ["dist"]` onto multiple
          # lines. Biome's JSON formatter prefers the inline form, so
          # without this auto-fix every post-merge CI run lint-fails on
          # 14 format errors until someone re-runs `biome check --write`
          # locally and pushes. The `changeset:version` script chains
          # `biome check --write packages/*/package.json` after the
          # version step so the Version Packages PR lands with
          # already-canonical formatting. `version:` is forwarded to
          # `execFile`, not a shell, so the `&&` must live inside a
          # package.json script — not on this line.
          version: pnpm run changeset:version
          # main: exactly `pnpm changeset publish`, as before. next: explicit
          # `--tag next` so a prerelease can never land on `latest`.
          publish: ${{ github.ref_name == 'next' && 'pnpm changeset publish --tag next' || 'pnpm changeset publish' }}
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NPM_CONFIG_PROVENANCE requires a public repo; disabled for private repos
          NPM_CONFIG_PROVENANCE: false

      # Empirical post-publish verification — `pnpm changeset publish`
      # has been observed reporting success while individual scoped
      # packages silently failed to upload (NPM_TOKEN scope permits
      # update but not create on @directive-run/*). Hit the registry
      # directly for each published package; fail if 404. This turns
      # silent ship failures into loud red CI runs.
      - name: Verify packages reached npm
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -e
          published='${{ steps.changesets.outputs.publishedPackages }}'
          if [ -z "$published" ] || [ "$published" = "null" ]; then
            echo "No publishedPackages output — skipping verify."
            exit 0
          fi
          # Use process substitution so the loop runs in this shell —
          # piping into `while` puts the loop in a subshell, where
          # `fail=1` cannot escape to the parent's `exit $fail`. The
          # previous form silently exited 0 even when every package
          # 404'd; the 2026-06-02 release of claude-plugin@1.16.0 and
          # knowledge-mcp@0.1.0 shipped green CI but never reached npm.
          # Retried, because the registry does not serve a package the instant
          # `publish` returns. Measured: `@directive-run/cli` has twice been the
          # last to appear, and on the 1.33.0 release it became visible 2m03s
          # after publishing — twenty-seven seconds after a one-minute window
          # gave up. The window is five minutes for that reason.
          #
          # A check that cries wolf is a check people learn to scroll past, and
          # this one is the only thing between a silent publish failure and a
          # green run. Being slow to pass costs a few minutes; being wrong costs
          # the check.
          fail=0
          while read -r pkg; do
            name=$(echo "$pkg" | jq -r '.name')
            version=$(echo "$pkg" | jq -r '.version')
            url="https://registry.npmjs.org/${name}/${version}"
            status=000
            for attempt in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo 000)
              if [ "$status" = "200" ]; then
                break
              fi
              echo "Verify: $url — HTTP ${status}, attempt ${attempt}/30"
              sleep 10
            done
            if [ "$status" != "200" ]; then
              # Says what it saw, not what it concludes. The previous wording
              # asserted "not propagation lag" on evidence that could not
              # support it, and was wrong the first time it fired.
              echo "::error title=Publish verification failed::${name}@${version} still returned HTTP ${status} after 30 attempts over five minutes. Either it never reached the registry — check the token's permissions for the @directive-run/* scope — or propagation is slower than five minutes, which has not been observed. Check https://www.npmjs.com/package/${name} before assuming the release failed."
              fail=1
            else
              echo "Verify: $url — ok"
            fi
          done < <(echo "$published" | jq -c '.[]')
          exit $fail

      # Dist-tag safety. On main, `latest` must become the version just
      # published (retried: the registry lags). On next, `latest` must be
      # exactly what it was before the run and must not be a prerelease or a
      # newer major than the stable line.
      - name: Verify npm dist-tags
        if: steps.changesets.outputs.published == 'true'
        env:
          BEFORE: ${{ steps.latest_before.outputs.version }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -e
          if [ "${GITHUB_REF_NAME}" = "next" ]; then
            latest=$(npm view @directive-run/core dist-tags.latest || true)
            if [ "$latest" != "$BEFORE" ]; then
              echo "::error title=latest moved on next::latest was ${BEFORE} before this run and is ${latest} now. A next publish must never touch latest."
              exit 1
            fi
            case "$latest" in
              *-*|2.*|[3-9].*) echo "::error title=latest is a prerelease or 2.x::latest=${latest}"; exit 1;;
            esac
            echo "Verify: latest unchanged at ${latest}"
            exit 0
          fi
          want=$(echo "$PUBLISHED" | jq -r '[.[] | select(.name == "@directive-run/core")][0].version // empty')
          if [ -z "$want" ]; then
            # Core was not part of this publish: latest must simply not have moved to a prerelease.
            latest=$(npm view @directive-run/core dist-tags.latest || true)
            case "$latest" in
              *-*) echo "::error title=latest is a prerelease::latest=${latest}"; exit 1;;
            esac
            echo "Verify: core not published this run; latest=${latest}"
            exit 0
          fi
          latest=""
          for attempt in $(seq 1 30); do
            latest=$(npm view @directive-run/core dist-tags.latest || true)
            if [ "$latest" = "$want" ]; then
              echo "Verify: latest=${latest} matches published ${want}"
              exit 0
            fi
            echo "Verify: latest=${latest}, want ${want}, attempt ${attempt}/30"
            sleep 10
          done
          echo "::error title=latest dist-tag mismatch::Published @directive-run/core@${want} but latest is ${latest} after five minutes."
          exit 1

  docs-artifacts:
    name: Publish docs artifacts
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # This job generates the next api-reference.json, but it has to build
      # the packages before it can, and that build needs the current one. Not
      # circular — it reads the previous release's file and publishes a fresh
      # one below.
      # Major-aware: only releases of this tree's major are considered.
      - name: Fetch api-reference.json from the newest release carrying it
        run: .github/scripts/fetch-api-reference.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm -r --filter './packages/*' build

      - name: Install docs tooling
        run: npm i -g @directive-run/toolkit@latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract API docs
        run: |
          mkdir -p docs-artifacts
          extract-api-docs \
            --packages packages/core,packages/ai \
            --out docs-artifacts

      - name: Bundle knowledge
        run: |
          if [ -d "packages/knowledge/core" ]; then
            tar czf docs-artifacts/knowledge.tar.gz \
              -C packages/knowledge core/ examples/ api-skeleton.md 2>/dev/null || true
          fi

      - name: Upload release assets
        run: |
          # Attach to core's release for this tree's version, so the asset's
          # tag carries the tree's major (fetch-api-reference.sh selects by
          # tag major). Fall back only to the newest release of the SAME major:
          # never attach this tree's docs to another major's release.
          VERSION=$(node -p "require('./packages/core/package.json').version")
          MAJOR="${VERSION%%.*}"
          TAG="@directive-run/core@${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            TAG=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E "@${MAJOR}\.[0-9]+\.[0-9]+" | head -1 || true)
          fi
          if [ -z "$TAG" ]; then
            echo "::error title=No release for major ${MAJOR}::Found no release tagged @${MAJOR}.x.y to attach docs to."
            exit 1
          fi
          gh release upload "$TAG" docs-artifacts/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger docs deploy
        if: vars.VERCEL_DEPLOY_HOOK_DOCS != '' && github.ref_name == 'main'
        run: curl -sS -X POST "$HOOK_URL"
        env:
          HOOK_URL: ${{ vars.VERCEL_DEPLOY_HOOK_DOCS }}
