name: Release

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".changeset/**"
      - ".github/workflows/release.yml"
      - "pnpm-lock.yaml"
  # Manual entry point for a workflow-wiring rehearsal. dry_run=true
  # runs the same build/typecheck/test pipeline as a real release but
  # skips the changesets publish step. Use to verify pipeline health
  # or workflow-file changes without cutting a real release.
  #
  # Note: dry_run does NOT exercise the broadcast path — broadcast
  # lives in broadcast.yml and triggers on release:published (see the
  # header of that file for why the split exists). To rehearse
  # broadcast, create a draft GitHub Release and publish it; the draft
  # publish fires release:published and drives broadcast.yml without
  # touching npm.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearsal mode: run build+typecheck+tests, skip npm publish."
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  # Opt into Node 24 for JavaScript actions ahead of GH's 2026-06-02
  # forced flip; lets us keep current pinned SHAs (Node 20-era) running
  # until the action authors ship Node 24 releases.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    outputs:
      # Real publish path (push event) OR forced-true from the dry-run
      # mark step (workflow_dispatch with dry_run=true). The two paths
      # are mutually exclusive — one is gated to `push`, the other to
      # `workflow_dispatch` — so the `||` never has a real-publish
      # falsy string shadowing a dry-run "true".
      published: ${{ steps.changesets.outputs.published || steps.dry_run_publish.outputs.published }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r --filter './packages/*' build

      - run: pnpm -r --filter './packages/*' typecheck

      - run: pnpm test -- --run

      - name: Create Release Pull Request or Publish
        id: changesets
        # Gate off in dry-run — a manual dispatch would otherwise pick
        # up any pending Version Packages PR and publish it for real.
        if: github.event_name == 'push'
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          # `changeset version` rewrites packages/*/package.json with the
          # bumped versions and expands `"files": ["dist"]` onto multiple
          # lines. Biome's JSON formatter prefers the inline form, so
          # without this auto-fix every post-merge CI run lint-fails on
          # 14 format errors until someone re-runs `biome check --write`
          # locally and pushes. The `changeset:version` script chains
          # `biome check --write packages/*/package.json` after the
          # version step so the Version Packages PR lands with
          # already-canonical formatting. `version:` is forwarded to
          # `execFile`, not a shell, so the `&&` must live inside a
          # package.json script — not on this line.
          version: pnpm run changeset:version
          publish: pnpm changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NPM_CONFIG_PROVENANCE requires a public repo; disabled for private repos
          NPM_CONFIG_PROVENANCE: false

      # Empirical post-publish verification — `pnpm changeset publish`
      # has been observed reporting success while individual scoped
      # packages silently failed to upload (NPM_TOKEN scope permits
      # update but not create on @directive-run/*). Hit the registry
      # directly for each published package; fail if 404. This turns
      # silent ship failures into loud red CI runs.
      - name: Verify packages reached npm
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -e
          published='${{ steps.changesets.outputs.publishedPackages }}'
          if [ -z "$published" ] || [ "$published" = "null" ]; then
            echo "No publishedPackages output — skipping verify."
            exit 0
          fi
          # Use process substitution so the loop runs in this shell —
          # piping into `while` puts the loop in a subshell, where
          # `fail=1` cannot escape to the parent's `exit $fail`. The
          # previous form silently exited 0 even when every package
          # 404'd; the 2026-06-02 release of claude-plugin@1.16.0 and
          # knowledge-mcp@0.1.0 shipped green CI but never reached npm.
          fail=0
          while read -r pkg; do
            name=$(echo "$pkg" | jq -r '.name')
            version=$(echo "$pkg" | jq -r '.version')
            url="https://registry.npmjs.org/${name}/${version}"
            echo "Verify: $url"
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$status" != "200" ]; then
              echo "::error title=Publish verification failed::${name}@${version} returned HTTP ${status} from npm registry. Token likely lacks 'create new package' permission for @directive-run/* scope."
              fail=1
            fi
          done < <(echo "$published" | jq -c '.[]')
          exit $fail

      # Dry-run rehearsal: mark the release job's `published` output
      # true so the downstream broadcast job runs. The action itself
      # receives `dry-run: true` and returns synthetic post IDs
      # without touching platform APIs or the Worker.
      - name: Force published output true for dry-run
        id: dry_run_publish
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: echo "published=true" >> "$GITHUB_OUTPUT"

  docs-artifacts:
    name: Publish docs artifacts
    needs: release
    # push-only: dry-run has nothing to attach to (no real GH release).
    if: needs.release.outputs.published == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build

      - name: Install docs tooling
        run: npm i -g @directive-run/toolkit@latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract API docs
        run: |
          mkdir -p docs-artifacts
          extract-api-docs \
            --packages packages/core,packages/ai \
            --out docs-artifacts

      - name: Bundle knowledge
        run: |
          if [ -d "packages/knowledge/core" ]; then
            tar czf docs-artifacts/knowledge.tar.gz \
              -C packages/knowledge core/ examples/ api-skeleton.md 2>/dev/null || true
          fi

      - name: Upload release assets
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" docs-artifacts/* --clobber || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger docs deploy
        if: vars.VERCEL_DEPLOY_HOOK_DOCS != ''
        run: curl -sS -X POST "$HOOK_URL"
        env:
          HOOK_URL: ${{ vars.VERCEL_DEPLOY_HOOK_DOCS }}

  # Broadcast moved to .github/workflows/broadcast.yml. See that file's
  # header for the rationale — short version: the action needs a
  # release:published event, which this push-triggered workflow can't
  # provide. When changesets publish creates the GitHub Release,
  # release:published fires and broadcast.yml runs against a real
  # release payload.
