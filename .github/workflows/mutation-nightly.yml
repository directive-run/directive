name: Mutation testing (nightly)

# Measures how strong the conformance suite is: Stryker mutates the 1.35
# engine (packages/core/src/core) and the suite (conformance:local projects,
# which run against core SOURCE) must kill each mutant. Report-only for now:
# the 80% gate comes later (see packages/conformance/MUTATION.md).
#
# Sharded by engine file group so each job stays far under the 6 h limit. The
# incremental file is cached per shard, so only mutants in changed code or
# changed tests are re-run after the first night.

on:
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    name: mutate (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: engine
            mutate: packages/core/src/core/engine.ts
          - shard: resolvers
            mutate: packages/core/src/core/resolvers.ts,packages/core/src/core/requirements.ts,packages/core/src/core/timer.ts,packages/core/src/core/clock.ts,packages/core/src/core/constraints.ts
          - shard: system
            mutate: packages/core/src/core/system.ts,packages/core/src/core/system-proxies.ts,packages/core/src/core/system-module-transform.ts
          - shard: predicate
            mutate: packages/core/src/core/predicate*.ts
          - shard: state
            mutate: packages/core/src/core/facts.ts,packages/core/src/core/tracking.ts,packages/core/src/core/derivations.ts,packages/core/src/core/effects.ts,packages/core/src/core/module.ts,packages/core/src/core/plugins.ts,packages/core/src/core/read-only-view.ts,packages/core/src/core/internal-scopes.ts
          - shard: rest
            mutate: packages/core/src/core/errors.ts,packages/core/src/core/schema-builders.ts,packages/core/src/core/schema-introspection.ts,packages/core/src/core/sources.ts,packages/core/src/core/replay-under.ts,packages/core/src/core/sweep-under.ts,packages/core/src/core/rules-diff.ts,packages/core/src/core/predict.ts,packages/core/src/core/doctor.ts,packages/core/src/core/engine-trace.ts,packages/core/src/core/engine-accessors.ts,packages/core/src/core/engine-definitions.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One conformance test spawns a process against core's built output.
      - run: pnpm --filter @directive-run/core build

      - name: Restore incremental cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/conformance/.stryker-cache
          key: mutation-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: mutation-${{ matrix.shard }}-

      - name: Mutate
        run: pnpm --filter @directive-run/conformance mutate:file "${{ matrix.mutate }}"

      - name: Save incremental cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/conformance/.stryker-cache
          key: mutation-${{ matrix.shard }}-${{ github.run_id }}

      - name: Name the reports
        if: ${{ !cancelled() }}
        run: |
          cd packages/conformance/reports/mutation
          mv mutation.json "${{ matrix.shard }}.json"
          mv mutation.html "${{ matrix.shard }}.html"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-${{ matrix.shard }}
          path: |
            packages/conformance/reports/mutation/${{ matrix.shard }}.json
            packages/conformance/reports/mutation/${{ matrix.shard }}.html
          retention-days: 30

  summary:
    name: Per-shard scores
    needs: mutate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-*
          path: reports
          merge-multiple: true

      - name: Print scores
        shell: node {0}
        run: |
          const fs = require("fs");
          const rows = [];
          const total = { killed: 0, survived: 0, noCov: 0, timeout: 0 };
          for (const f of fs.readdirSync("reports").filter((n) => n.endsWith(".json")).sort()) {
            const r = JSON.parse(fs.readFileSync(`reports/${f}`, "utf8"));
            const c = { Killed: 0, Survived: 0, NoCoverage: 0, Timeout: 0 };
            for (const file of Object.values(r.files)) {
              for (const m of file.mutants) {
                if (m.status in c) c[m.status]++;
              }
            }
            const det = c.Killed + c.Timeout;
            const denom = det + c.Survived + c.NoCoverage;
            total.killed += c.Killed; total.timeout += c.Timeout;
            total.survived += c.Survived; total.noCov += c.NoCoverage;
            rows.push(`| ${f.replace(".json", "")} | ${denom} | ${det} | ${c.Survived} | ${c.NoCoverage} | ${denom ? ((100 * det) / denom).toFixed(1) : "-"}% |`);
          }
          const det = total.killed + total.timeout;
          const denom = det + total.survived + total.noCov;
          rows.push(`| **all** | ${denom} | ${det} | ${total.survived} | ${total.noCov} | ${denom ? ((100 * det) / denom).toFixed(1) : "-"}% |`);
          const out = ["## Mutation score by shard (report-only)", "", "| shard | mutants | killed | survived | no coverage | score |", "|---|---|---|---|---|---|", ...rows].join("\n");
          console.log(out);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
