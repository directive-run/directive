name: Mutation testing (nightly)

# Measures how strong the conformance suite is: Stryker mutates the 1.35
# engine (packages/core/src/core) and the suite (conformance:local projects,
# which run against core SOURCE) must kill each mutant. Report-only for now:
# the 80% gate comes later (see packages/conformance/MUTATION.md).
#
# Sharded by layer (MUTATION.md table), each shard run with that layer as its
# ceiling (MUTATION_LAYER), so each job stays far under the 6 h limit. Every
# file of packages/core/src/core/ (except types.ts) is in exactly one shard,
# at its MUTATION.md row's layer: scripts/__tests__/mutation-shards.test.ts
# fails when the shards and the table disagree. The
# incremental file is cached per shard, so only mutants in changed code or
# changed tests are re-run after the first night.
#
# Once a week (and on dispatch with `ceiling: none`) the same shards run
# with no ceiling: the full run. Its reports are what `mutation-score.ts
# --full` needs to defer a NoCoverage mutant that only tests above the
# ceiling reach (MUTATION.md, "Deferral"). The nightly summary downloads
# the latest full-run reports; without any it defers nothing. The full run
# is scored on its own too, and must keep passing.

on:
  schedule:
    - cron: "41 8 * * *"
    # The weekly full (no-ceiling) run. Keep in step with `full` below.
    - cron: "11 3 * * 0"
  workflow_dispatch:
    inputs:
      ceiling:
        description: "layer: each shard at its layer's ceiling; none: the full run"
        type: choice
        options: [layer, none]
        default: layer
      gate:
        description: "Ln: the layer gate before building Ln (shards below Ln run at ceiling Ln, then mutation-score --gate Ln). Empty: off."
        type: string
        default: ""

permissions:
  contents: read

env:
  # A gate run (MUTATION.md, "The layer gate collects every deferral") is
  # never a full run.
  GATE: ${{ inputs.gate || '' }}
  FULL: ${{ !inputs.gate && (github.event.schedule == '11 3 * * 0' || inputs.ceiling == 'none') }}
  # The artifact and cache name prefix: full-, gate-Ln-, or none.
  PREFIX: ${{ inputs.gate && format('gate-{0}-', inputs.gate) || ((github.event.schedule == '11 3 * * 0' || inputs.ceiling == 'none') && 'full-' || '') }}

jobs:
  mutate:
    name: mutate (${{ matrix.shard }}${{ inputs.gate && format(', gate {0}', inputs.gate) || ((github.event.schedule == '11 3 * * 0' || inputs.ceiling == 'none') && ', full' || '') }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # One shard per MUTATION.md layer row (L3 and L11 split for time, L6 by feature).
        # A shard's files are the table's files for its row, no more, no less.
        # `layer` is the shard's ceiling: tests placed above it are left out,
        # so each score counts only kills by tests that run on v2 there.
        include:
          - shard: l1-state
            layer: L1
            mutate: packages/core/src/core/facts.ts,packages/core/src/core/derivations.ts,packages/core/src/core/effects.ts,packages/core/src/core/tracking.ts,packages/core/src/core/read-only-view.ts,packages/core/src/core/module.ts
          - shard: l2-resolvers
            layer: L2
            mutate: packages/core/src/core/constraints.ts,packages/core/src/core/resolvers.ts,packages/core/src/core/requirements.ts
          - shard: l3-engine
            layer: L3
            mutate: packages/core/src/core/engine.ts
          - shard: l3-system
            layer: L3
            mutate: packages/core/src/core/system.ts,packages/core/src/core/system-proxies.ts,packages/core/src/core/system-module-transform.ts
          - shard: l3-rest
            layer: L3
            mutate: packages/core/src/core/engine-accessors.ts,packages/core/src/core/errors.ts,packages/core/src/core/plugins.ts,packages/core/src/core/schema-builders.ts,packages/core/src/core/clock.ts,packages/core/src/core/timer.ts
          - shard: l5-sources
            layer: L5
            mutate: packages/core/src/core/sources.ts
          - shard: l6-introspection
            layer: L6
            mutate: packages/core/src/core/schema-introspection.ts
          - shard: l6-hydration
            layer: L6
            mutate: packages/core/src/core/internal-scopes.ts
          - shard: l9-trace
            layer: L9
            mutate: packages/core/src/core/engine-trace.ts
          - shard: l10-dynamic
            layer: L10
            mutate: packages/core/src/core/engine-definitions.ts
          - shard: l11-predicate
            layer: L11
            mutate: packages/core/src/core/predicate*.ts
          - shard: l11-rest
            layer: L11
            mutate: packages/core/src/core/predict.ts,packages/core/src/core/sweep-under.ts,packages/core/src/core/replay-under.ts,packages/core/src/core/rules-diff.ts,packages/core/src/core/doctor.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One conformance test spawns a process against core's built output.
      - run: pnpm --filter @directive-run/core build
      # The conformance vitest config resolves core-next's dist for the v2
      # projects when it loads, so it must exist even though Stryker only
      # runs the local projects.
      - run: pnpm --filter @directive-run/core-next build

      - name: Restore incremental cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/conformance/.stryker-cache
          # layers.json in the key: a test that moves layer changes which
          # tests may kill, so results cached under the old placement are
          # not reused.
          # A full run's results differ from a ceiling run's: its own cache.
          key: mutation-${{ env.PREFIX }}${{ matrix.shard }}-${{ hashFiles('packages/conformance/layers.json') }}-${{ github.run_id }}
          restore-keys: mutation-${{ env.PREFIX }}${{ matrix.shard }}-${{ hashFiles('packages/conformance/layers.json') }}-

      - name: Mutate
        id: mutate
        env:
          LAYER: ${{ matrix.layer }}
        run: |
          if [ -n "$GATE" ]; then
            # A gate run: only shards below the gate layer hold entries it
            # checks, and they run at the gate's ceiling.
            if ! echo "$GATE" | grep -Eq '^L([0-9]|1[0-3])$'; then
              echo "gate must be L0..L13, got '$GATE'" >&2; exit 1
            fi
            if [ "${LAYER#L}" -ge "${GATE#L}" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "shard ${{ matrix.shard }} ($LAYER) is not below the gate $GATE"
              exit 0
            fi
            export MUTATION_LAYER="$GATE"
          elif [ "$FULL" != "true" ]; then
            # The full run sets no ceiling: every non-internals test counts.
            export MUTATION_LAYER="$LAYER"
          fi
          pnpm --filter @directive-run/conformance mutate:file "${{ matrix.mutate }}"

      - name: Save incremental cache
        if: ${{ !cancelled() && steps.mutate.outputs.skip != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/conformance/.stryker-cache
          key: mutation-${{ env.PREFIX }}${{ matrix.shard }}-${{ hashFiles('packages/conformance/layers.json') }}-${{ github.run_id }}

      - name: Name the reports
        if: ${{ !cancelled() && steps.mutate.outputs.skip != 'true' }}
        run: |
          cd packages/conformance/reports/mutation
          mv mutation.json "${{ matrix.shard }}.json"
          mv mutation.html "${{ matrix.shard }}.html"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.mutate.outputs.skip != 'true' }}
        with:
          name: mutation-${{ env.PREFIX }}${{ matrix.shard }}
          path: |
            packages/conformance/reports/mutation/${{ matrix.shard }}.json
            packages/conformance/reports/mutation/${{ matrix.shard }}.html
          # Full-run reports serve every nightly until the next weekly run:
          # kept for five weeks so one failed weekly run does not lose them.
          retention-days: ${{ env.FULL == 'true' && 35 || 30 }}

  summary:
    name: Per-shard scores
    needs: mutate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To list and download the latest full-run artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            packages/conformance/package.json
            packages/conformance/MUTATION.md
            packages/conformance/scripts/mutation-score.ts
            packages/conformance/mutation-triage
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.GATE != '' && format('mutation-gate-{0}-*', env.GATE) || (env.FULL == 'true' && 'mutation-full-*' || 'mutation-l*') }}
          path: reports
          merge-multiple: true

      # A ceiling run defers NoCoverage mutants the full run reaches, so it
      # needs the latest full-run report of each shard (any run: the newest
      # unexpired artifact of that name). None yet: nothing is deferred.
      - name: Fetch the latest full-run reports
        if: ${{ env.FULL != 'true' && env.GATE == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p full
          for shard in l1-state l2-resolvers l3-engine l3-system l3-rest l5-sources l6-introspection l6-hydration l9-trace l10-dynamic l11-predicate l11-rest; do
            id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=mutation-full-$shard&per_page=1" --jq '.artifacts[0].id // empty')
            if [ -z "$id" ]; then echo "no full-run report for $shard"; continue; fi
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "full/$shard.zip"
            unzip -o -q "full/$shard.zip" "$shard.json" -d full && rm "full/$shard.zip"
          done
          ls full

      # Report-only: no --check. The script appends the table to the job
      # summary. The full run is scored as it is (it must keep passing).
      - name: Print scores
        run: |
          score="npx --yes tsx@4.21.0 packages/conformance/scripts/mutation-score.ts"
          if [ -n "$GATE" ]; then
            # The layer gate: blocking for this run (exit 1 while debt is owed).
            $score --gate "$GATE" --at reports
          elif [ "$FULL" = "true" ]; then
            $score reports
          elif ls full/*.json > /dev/null 2>&1; then
            # Each shard ran at its MUTATION.md row's layer.
            $score --layer row --full full reports
          else
            $score --layer row reports
          fi
