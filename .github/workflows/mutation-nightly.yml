name: Mutation testing (nightly)

# Measures how strong the conformance suite is: Stryker mutates the 1.35
# engine (packages/core/src/core) and the suite (conformance:local projects,
# which run against core SOURCE) must kill each mutant. Report-only for now:
# the 80% gate comes later (see packages/conformance/MUTATION.md).
#
# Sharded by layer (MUTATION.md table), each shard run with that layer as its
# ceiling (MUTATION_LAYER), so each job stays far under the 6 h limit. The
# incremental file is cached per shard, so only mutants in changed code or
# changed tests are re-run after the first night.

on:
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    name: mutate (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # One shard per MUTATION.md layer row (L3 and L11 split for time).
        # `layer` is the shard's ceiling: tests placed above it are left out,
        # so each score counts only kills by tests that run on v2 there.
        include:
          - shard: l1-state
            layer: L1
            mutate: packages/core/src/core/facts.ts,packages/core/src/core/derivations.ts,packages/core/src/core/effects.ts,packages/core/src/core/tracking.ts,packages/core/src/core/read-only-view.ts,packages/core/src/core/module.ts,packages/core/src/core/internal-scopes.ts
          - shard: l2-resolvers
            layer: L2
            mutate: packages/core/src/core/constraints.ts,packages/core/src/core/resolvers.ts,packages/core/src/core/requirements.ts,packages/core/src/core/timer.ts,packages/core/src/core/clock.ts
          - shard: l3-engine
            layer: L3
            mutate: packages/core/src/core/engine.ts
          - shard: l3-system
            layer: L3
            mutate: packages/core/src/core/system.ts,packages/core/src/core/system-proxies.ts,packages/core/src/core/system-module-transform.ts
          - shard: l3-rest
            layer: L3
            mutate: packages/core/src/core/engine-accessors.ts,packages/core/src/core/engine-definitions.ts,packages/core/src/core/engine-trace.ts,packages/core/src/core/errors.ts,packages/core/src/core/plugins.ts,packages/core/src/core/schema-builders.ts,packages/core/src/core/schema-introspection.ts,packages/core/src/core/sources.ts
          - shard: l11-predicate
            layer: L11
            mutate: packages/core/src/core/predicate*.ts
          - shard: l11-rest
            layer: L11
            mutate: packages/core/src/core/predict.ts,packages/core/src/core/sweep-under.ts,packages/core/src/core/replay-under.ts,packages/core/src/core/rules-diff.ts,packages/core/src/core/doctor.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One conformance test spawns a process against core's built output.
      - run: pnpm --filter @directive-run/core build
      # The conformance vitest config resolves core-next's dist for the v2
      # projects when it loads, so it must exist even though Stryker only
      # runs the local projects.
      - run: pnpm --filter @directive-run/core-next build

      - name: Restore incremental cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/conformance/.stryker-cache
          # layers.json in the key: a test that moves layer changes which
          # tests may kill, so results cached under the old placement are
          # not reused.
          key: mutation-${{ matrix.shard }}-${{ hashFiles('packages/conformance/layers.json') }}-${{ github.run_id }}
          restore-keys: mutation-${{ matrix.shard }}-${{ hashFiles('packages/conformance/layers.json') }}-

      - name: Mutate
        env:
          MUTATION_LAYER: ${{ matrix.layer }}
        run: pnpm --filter @directive-run/conformance mutate:file "${{ matrix.mutate }}"

      - name: Save incremental cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/conformance/.stryker-cache
          key: mutation-${{ matrix.shard }}-${{ hashFiles('packages/conformance/layers.json') }}-${{ github.run_id }}

      - name: Name the reports
        if: ${{ !cancelled() }}
        run: |
          cd packages/conformance/reports/mutation
          mv mutation.json "${{ matrix.shard }}.json"
          mv mutation.html "${{ matrix.shard }}.html"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-${{ matrix.shard }}
          path: |
            packages/conformance/reports/mutation/${{ matrix.shard }}.json
            packages/conformance/reports/mutation/${{ matrix.shard }}.html
          retention-days: 30

  summary:
    name: Per-shard scores
    needs: mutate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            packages/conformance/package.json
            packages/conformance/scripts/mutation-score.ts
            packages/conformance/mutation-triage
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-*
          path: reports
          merge-multiple: true

      # Report-only: no --check. The script appends the table to the job summary.
      - name: Print scores
        run: npx --yes tsx@4.21.0 packages/conformance/scripts/mutation-score.ts reports
